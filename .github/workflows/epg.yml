name: Guide des programmes

# Régénère epg.xml chaque jour (1 jour passé, 7 jours à venir) pour que le guide reste valable.
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  epg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Générer epg.xml
        run: python3 outils/generer_epg.py epg.xml
      - name: Enregistrer si le guide a changé
        run: |
          if git diff --quiet -- epg.xml; then
            echo "Guide inchangé."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add epg.xml
          git commit -m "Guide des programmes du $(date -u +%Y-%m-%d)"
          git push
      - name: Republier GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Republication déjà en cours."
